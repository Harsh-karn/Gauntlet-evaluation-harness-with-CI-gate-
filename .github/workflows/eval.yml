name: eval-gate

on:
  pull_request:
    branches: [main]

jobs:
  eval:
    name: "Gauntlet CI Gate"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Gauntlet Evaluation Suites
        run: |
          python -m gauntlet.cli run --suites safety,quality,adversarial --baseline baselines/main.json --report-dir report
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GAUNTLET_BUDGET: 5.00

      - name: Upload Evaluation Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: report/

      - name: Post PR Comment
        if: always()
        run: |
          python -m gauntlet.cli comment --pr ${{ github.event.pull_request.number }} --report-dir report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
