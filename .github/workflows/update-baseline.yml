name: update-baseline

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "suites/**"
      - "src/**"

jobs:
  baseline:
    name: "Sync Accepted Baseline"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Regenerate Baseline on Main
        run: |
          python -c "from pathlib import Path; import sys; from gauntlet.loader import load_suite; from gauntlet.runner import GauntletRunner; from gauntlet.scorer import Scorer; r = GauntletRunner(); s = Scorer(); cases = []; [cases.extend(r.run_suite(load_suite(f'suites/{name}.yaml'))) for name in ['safety', 'quality', 'adversarial']]; report = s.score_results(cases); (s.export_baseline(report, 'baselines/main.json') if report.gate_passed else (print('Gate failed on main: Refusing to update baseline!'), sys.exit(1)))"
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          JUDGE_API_KEY: ${{ secrets.JUDGE_API_KEY || secrets.LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.LLM_API_KEY }}

      - name: Commit and Push Updated Baseline
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add baselines/main.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(baseline): update baselines/main.json on merge to main" && git push)
